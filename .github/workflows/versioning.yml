# Sandbox proxy for the CI_Toolkit versioning check.
# Calls the composite action directly: CI_Toolkit has no reusable
# .github/workflows/ci-versioning.yml, only .github/actions/ci-versioning.
# Pinned to the validation branch, not develop.

name: Versioning

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  ci-versioning:
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    steps:
      - name: Run versioning
        uses: BuroHappoldEngineeringAdmin/CI_Toolkit/.github/actions/ci-versioning@validate/versioning-eventmessage-traversal
        with:
          app_id: ${{ secrets.BHOM_APP_ID }}
          private_key: ${{ secrets.BHOM_APP_PRIVATE_KEY }}
